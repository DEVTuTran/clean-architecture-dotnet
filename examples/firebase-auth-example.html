<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Authentication Example</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .error {
            color: red;
            margin-top: 10px;
        }

        .success {
            color: green;
            margin-top: 10px;
        }

        .user-info {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <h1>Firebase Authentication Example</h1>

    <div id="auth-forms">
        <h2>Login</h2>
        <div class="form-group">
            <label for="login-email">Email:</label>
            <input type="email" id="login-email" placeholder="Enter your email">
        </div>
        <div class="form-group">
            <label for="login-password">Password:</label>
            <input type="password" id="login-password" placeholder="Enter your password">
        </div>
        <button onclick="login()">Login</button>

        <h2>Register</h2>
        <div class="form-group">
            <label for="register-name">Name:</label>
            <input type="text" id="register-name" placeholder="Enter your name">
        </div>
        <div class="form-group">
            <label for="register-email">Email:</label>
            <input type="email" id="register-email" placeholder="Enter your email">
        </div>
        <div class="form-group">
            <label for="register-password">Password:</label>
            <input type="password" id="register-password" placeholder="Enter your password">
        </div>
        <button onclick="register()">Register</button>
    </div>

    <div id="user-info" style="display: none;">
        <h2>User Information</h2>
        <div class="user-info">
            <p><strong>Name:</strong> <span id="user-name"></span></p>
            <p><strong>Email:</strong> <span id="user-email"></span></p>
            <p><strong>UID:</strong> <span id="user-uid"></span></p>
        </div>
        <button onclick="logout()">Logout</button>
        <button onclick="getCurrentUser()">Get Current User</button>
    </div>

    <div id="message"></div>

    <script>
        // Firebase configuration - Replace with your own config
        const firebaseConfig = {
            apiKey: "your-api-key",
            authDomain: "your-project.firebaseapp.com",
            projectId: "your-project-id",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "123456789",
            appId: "your-app-id"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // API base URL
        const API_BASE_URL = 'https://localhost:5005/api'; // Update with your API URL

        // Check if user is already logged in
        auth.onAuthStateChanged(function (user) {
            if (user) {
                showUserInfo(user);
            } else {
                showAuthForms();
            }
        });

        async function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const idToken = await userCredential.user.getIdToken();

                // Send token to your API
                const response = await fetch(`${API_BASE_URL}/auth/firebase-login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ idToken })
                });

                if (response.ok) {
                    const authResponse = await response.json();
                    localStorage.setItem('accessToken', authResponse.accessToken);
                    localStorage.setItem('refreshToken', authResponse.refreshToken);
                    showMessage('Login successful!', 'success');
                } else {
                    const error = await response.json();
                    showMessage(`Login failed: ${error.message}`, 'error');
                }
            } catch (error) {
                showMessage(`Login error: ${error.message}`, 'error');
            }
        }

        async function register() {
            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;

            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const idToken = await userCredential.user.getIdToken();

                // Send registration data to your API
                const response = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password, name })
                });

                if (response.ok) {
                    const authResponse = await response.json();
                    localStorage.setItem('accessToken', authResponse.accessToken);
                    localStorage.setItem('refreshToken', authResponse.refreshToken);
                    showMessage('Registration successful!', 'success');
                } else {
                    const error = await response.json();
                    showMessage(`Registration failed: ${error.message}`, 'error');
                }
            } catch (error) {
                showMessage(`Registration error: ${error.message}`, 'error');
            }
        }

        async function logout() {
            try {
                await auth.signOut();
                localStorage.removeItem('accessToken');
                localStorage.removeItem('refreshToken');
                showMessage('Logged out successfully!', 'success');
            } catch (error) {
                showMessage(`Logout error: ${error.message}`, 'error');
            }
        }

        async function getCurrentUser() {
            const token = localStorage.getItem('accessToken');
            if (!token) {
                showMessage('No access token found', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/auth/me`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const user = await response.json();
                    showMessage(`Current user: ${user.name} (${user.email})`, 'success');
                } else {
                    showMessage('Failed to get current user', 'error');
                }
            } catch (error) {
                showMessage(`Error getting current user: ${error.message}`, 'error');
            }
        }

        function showUserInfo(user) {
            document.getElementById('auth-forms').style.display = 'none';
            document.getElementById('user-info').style.display = 'block';
            document.getElementById('user-name').textContent = user.displayName || 'N/A';
            document.getElementById('user-email').textContent = user.email || 'N/A';
            document.getElementById('user-uid').textContent = user.uid || 'N/A';
        }

        function showAuthForms() {
            document.getElementById('auth-forms').style.display = 'block';
            document.getElementById('user-info').style.display = 'none';
        }

        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.className = type;
            setTimeout(() => {
                messageDiv.textContent = '';
                messageDiv.className = '';
            }, 5000);
        }
    </script>
</body>

</html>
